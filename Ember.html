<div id="tc-layout-proposals"><div id="studio" class="tc-app tc-classic">
<header class="tc-header"><strong class="tc-brand">Texture Studio</strong><span class="tc-badge">EMBER · 브라우저에서 실행</span><div class="ui-controls"><label for="ui-scale">UI 크기</label><input id="ui-scale" type="range" min="80" max="140" step="5" value="100" aria-label="UI 크기"><output id="ui-scale-value" for="ui-scale">100%</output><button id="reset-ui">UI 초기화</button></div><div class="tc-header-actions"><button id="undo" title="실행 취소 (Ctrl+Z)" disabled>↶</button><button id="redo" title="다시 실행 (Ctrl+Shift+Z)" disabled>↷</button><button id="save-preset">프리셋 저장</button><button id="load-preset">불러오기</button></div></header>
<div class="tc-body"><aside class="tc-rail" aria-label="레이어"><button id="add-layer" class="tc-add" aria-label="레이어 추가">＋</button><div id="layers" class="tc-layers"></div></aside>
<aside class="tc-source" aria-label="선택 레이어 설정"><section class="tc-panel"><div class="tc-panel-title">레이어 설정 <span>▾</span></div><div class="tc-panel-inner"><label class="tc-field">레이어 이름<input id="layer-name" maxlength="32" type="text"></label><label class="tc-field">합성 모드<select id="blend"><option value="normal">일반 (Normal)</option><option value="add">더하기 (Add)</option><option value="multiply">곱하기 (Multiply)</option><option value="screen">스크린 (Screen)</option><option value="mask">마스크 (Mask)</option></select></label><div id="opacity-control"></div><div class="layer-actions"><button id="move-up" aria-label="레이어 위로">↑</button><button id="move-down" aria-label="레이어 아래로">↓</button><button id="duplicate">복제</button><button id="remove-layer">삭제</button></div></div></section>
<section class="tc-panel"><div class="tc-panel-title">텍스처 · 기본 <span>▾</span></div><div class="tc-panel-inner"><label class="tc-field">타입 (Type)<select id="material"></select></label><label class="tc-check"><span>극좌표 변환</span><input id="polar" type="checkbox" title="현재 레이어 이미지 전체를 원형으로 감쌉니다"></label><label class="tc-check"><span>흑백 반전</span><input id="invert" type="checkbox"></label><details><summary>Transform</summary><div id="transform-controls"></div></details></div></section>
<section class="tc-panel"><div class="tc-panel-title">소재 파라미터 <span>▾</span></div><div class="tc-panel-inner"><div id="source-controls"></div><div class="seed-row"><label for="seed">시드</label><input id="seed" type="number" min="0" max="99999" step="1"><button id="random-seed" aria-label="랜덤 시드">⤨</button></div><button id="reset-layer" class="full-button">소재 값 초기화</button></div></section></aside>
<div id="left-splitter" class="panel-resizer" role="separator" aria-label="소재 설정 패널 너비" aria-orientation="vertical" aria-valuenow="174" tabindex="0"></div><main class="tc-center"><div class="tc-toolbar"><button id="open-export" class="tc-export">Save Export ▾</button><select id="samples" aria-label="샘플 프리셋"><option value="">샘플 선택</option><option value="energy">에너지 링</option><option value="fire">불꽃</option><option value="electric">번개</option><option value="slash">베기</option><option value="smoke">연기</option></select><label><input id="black-bg" type="checkbox">검정</label><label><input id="checker-bg" type="checkbox" checked>체커</label></div>
<div class="view-tools"><button id="repeat-view" aria-pressed="false">▦ 타일 반복 보기</button><label class="boundary-control"><input id="show-boundary" type="checkbox" checked>경계 표시</label><button id="fit-view">화면 맞춤</button><button id="actual-view">100%</button><span id="zoom-label">100%</span><span id="view-position">X 0 · Y 0</span></div><div id="stage" class="tc-stage-wrap"><canvas id="preview" class="tc-preview" width="512" height="512" role="img" aria-label="최종 텍스처 실시간 미리보기"></canvas><span id="resolution-label" class="tc-resolution-label">512 × 512 px</span></div>
<div class="tc-channel-row" role="group" aria-label="출력 채널"><button data-channel="rgba" aria-pressed="true">RGBA</button><button data-channel="alpha" aria-pressed="false">알파</button><button data-channel="rgb" aria-pressed="false">RGB</button><button id="bypass" aria-pressed="false">후처리 끄기</button><span id="selected-label"></span></div>
<div class="tc-transport"><button id="play" aria-label="애니메이션 재생">▶</button><button id="rewind" aria-label="시작으로 이동">↤</button><input id="timeline" type="range" min="0" max="1" step=".001" value="0" aria-label="시간 탐색"><span id="time-read" class="tc-time-read">0.00 / 2.00 s</span></div>
<details id="library" class="tc-type-browser"><summary class="tc-browser-head"><span>▸ 소재 라이브러리</span><span id="library-count"></span></summary><div class="library-filter"><input id="search" type="search" placeholder="소재 검색" aria-label="소재 검색"><select id="category" aria-label="소재 분류"><option value="all">전체</option></select></div><div class="library-modes"><button data-library-mode="all" aria-pressed="true">전체</button><button data-library-mode="favorites" aria-pressed="false">즐겨찾기</button><button data-library-mode="recent" aria-pressed="false">최근 사용</button><span id="library-results">119 / 119종</span></div><div id="materials" class="tc-type-grid"></div></details></main>
<div id="right-splitter" class="panel-resizer" role="separator" aria-label="후처리 패널 너비" aria-orientation="vertical" aria-valuenow="226" tabindex="0"></div><aside class="tc-right" aria-label="전역 설정과 후처리"><section class="tc-panel"><div class="tc-panel-title">전역 설정</div><div class="tc-panel-inner"><label class="tc-check"><span>심리스 타일링 생성</span><input id="tileable" type="checkbox"></label><div id="tile-blend-control"></div><label class="tc-field">해상도<select id="resolution"><option value="64">64 × 64</option><option value="128">128 × 128</option><option value="256">256 × 256</option><option value="512" selected>512 × 512</option><option value="1024">1024 × 1024</option><option value="2048">2048 × 2048</option></select></label></div></section>
<section class="tc-panel"><div class="tc-panel-title">애니메이션 <span>ANIMATION</span></div><div class="tc-panel-inner"><label class="tc-check"><span>심리스 루프</span><input id="loop" type="checkbox" checked></label><div id="speed-control"></div><div class="tc-split-fields"><label class="tc-field">FPS<select id="fps"><option>8</option><option selected>16</option><option>24</option><option>30</option></select></label><label class="tc-field">길이 (초)<input id="duration" type="number" min=".5" max="8" step=".5" value="2"></label></div><p id="effective-duration" class="hint"></p></div></section>
<section class="tc-panel"><div class="tc-panel-title">포스트 이펙트 <span>POST FX</span></div><div id="effects" class="tc-panel-inner"></div></section>
<section class="tc-panel"><div class="tc-panel-title">그라데이션 램프<input id="gradient-enabled" type="checkbox" checked aria-label="그라데이션 사용"></div><div class="tc-panel-inner"><div id="ramp" class="tc-ramp" aria-label="그라데이션 미리보기"></div><div id="gradient-stops"></div><div class="gradient-edit"><label>위치 <input id="stop-position" type="number" min="0" max="100" step="1" aria-label="색 정지점 위치">%</label><input id="stop-color" type="color" aria-label="선택한 정지점 색"><button id="add-stop" aria-label="색 정지점 추가">＋</button><button id="delete-stop" aria-label="선택 정지점 삭제">삭제</button></div><div id="palettes" class="tc-palettes"></div></div></section></aside></div>
<footer class="tc-footer"><span id="status" role="status" aria-live="polite">모든 계산은 이 브라우저 안에서 처리됩니다.</span><span id="animation-info">16 FPS · 2초 · 32프레임</span></footer></div></div>
<input id="preset-file" type="file" accept=".json,application/json" hidden>
<dialog id="export-dialog"><form method="dialog" class="dialog-head"><strong>내보내기</strong><button id="close-export" aria-label="내보내기 닫기">✕</button></form><div class="dialog-content"><div id="export-options"><label class="dialog-field">형식<select id="export-format"><option value="png">현재 프레임 PNG</option><option value="sheet">애니메이션 시트 PNG</option><option value="gif">애니메이션 GIF</option><option value="normal">노멀맵 PNG</option><option value="pack">채널 패킹 PNG</option></select></label><label class="dialog-field">크기<select id="export-size"><option>64</option><option>128</option><option>256</option><option selected>512</option><option>1024</option><option>2048</option></select></label><label id="export-channel-row" class="dialog-field">채널<select id="export-channel"><option value="rgba">RGBA · 컬러</option><option value="alpha">A · 흑백 마스크</option><option value="rgb">RGB · 검정 배경</option></select></label><label id="transparent-row" class="tc-check"><span>투명 배경</span><input id="export-transparent" type="checkbox" checked></label><div id="sheet-options" hidden><label class="dialog-field">프레임 수<select id="sheet-frames"><option>4</option><option>8</option><option selected>16</option><option>32</option><option>64</option></select></label><label class="dialog-field">열 수<select id="sheet-columns"><option>2</option><option selected>4</option><option>8</option></select></label><label class="tc-check"><span>재생 정보 JSON 함께 저장</span><input id="sheet-json" type="checkbox" checked></label></div><div id="gif-options" hidden><p class="hint">GIF는 최대 512px · 128프레임입니다. 색상은 256색이며 투명도는 켜짐/꺼짐으로 저장됩니다.</p></div><div id="normal-options" hidden><label class="dialog-field">노멀 강도<input id="normal-strength" type="number" min=".1" max="20" step=".1" value="3"></label><label class="tc-check"><span>Y 채널 반전</span><input id="normal-flip" type="checkbox"></label></div><div id="pack-options" hidden></div><p id="export-summary" class="export-summary"></p></div><div id="export-progress" hidden><label id="progress-label" for="progress">준비 중</label><progress id="progress" max="1" value="0"></progress></div><div class="dialog-buttons"><button id="cancel-export" type="button" hidden>생성 취소</button><button id="start-export" class="accent-button" type="button">파일 만들기</button></div></div></dialog>

$('ramp').onclick=e=>{if(state.stops.length>=8)return;const r=e.currentTarget.getBoundingClientRect(),position=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));change(()=>{const stop={position,color:state.stops[selectedStop].color};state.stops.push(stop);state.stops.sort((a,b)=>a.position-b.position);selectedStop=state.stops.indexOf(stop);});};
$('black-bg').onchange=e=>{viewer.checker=!e.target.checked;$('checker-bg').checked=!e.target.checked;viewer.paint();};$('checker-bg').onchange=e=>{viewer.checker=e.target.checked;$('black-bg').checked=!e.target.checked;viewer.paint();};$('repeat-view').onclick=()=>{viewer.setRepeat(!viewer.repeat);$('repeat-view').setAttribute('aria-pressed',String(viewer.repeat));};$('fit-view').onclick=()=>viewer.fit();$('actual-view').onclick=()=>viewer.actual();document.querySelectorAll('[data-channel]').forEach(b=>b.onclick=()=>{viewChannel=b.dataset.channel;document.querySelectorAll('[data-channel]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));draw();});$('bypass').onclick=()=>{bypass=!bypass;$('bypass').setAttribute('aria-pressed',String(bypass));draw();};
function filter(){const query=$('search').value.toLowerCase(),category=$('category').value;let count=0;document.querySelectorAll('[data-material]').forEach(b=>{const index=Number(b.dataset.material),m=M.materials[index],hidden=!(m[0]+' '+m[1]).toLowerCase().includes(query)||(category!=='all'&&m[2]!==category)||(libraryMode==='favorites'&&!favorites.has(index))||(libraryMode==='recent'&&!recent.includes(index));b.parentElement.hidden=hidden;if(!hidden)count++;});$('library-results').textContent=count+' / '+M.materials.length+'종';}$('search').oninput=filter;$('category').onchange=filter;
$('show-boundary').onchange=e=>{viewer.boundary=e.target.checked;$('resolution-label').hidden=!viewer.boundary;viewer.paint();try{localStorage.setItem('ember-view-boundary',String(viewer.boundary));}catch{}};
$('samples').onchange=e=>{if(!e.target.value)return;stop(false);change(()=>{state=M.sample(e.target.value);selectedStop=1;});thumbnails();draw();e.target.value='';status('샘플을 불러왔습니다. 이전 작업은 실행 취소로 복원할 수 있습니다.');};
$('undo').onclick=()=>{if(!undo.length)return;stop(false);redo.push(clone(state));state=undo.pop();pending=null;sync();draw();persist();$('undo').disabled=!undo.length;$('redo').disabled=!redo.length;};$('redo').onclick=()=>{if(!redo.length)return;stop(false);undo.push(clone(state));state=redo.pop();pending=null;sync();draw();persist();$('undo').disabled=!undo.length;$('redo').disabled=!redo.length;};
document.addEventListener('keydown',e=>{if(busy||$('export-dialog').open||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(e.shiftKey?'redo':'undo').click();}});
const results=document.createElement('div');results.id='export-results';results.hidden=true;$('export-progress').after(results);
function clearResults(){for(const url of resultUrls)URL.revokeObjectURL(url);resultUrls=[];results.replaceChildren();results.hidden=true;}
function showResults(files){clearResults();results.hidden=false;for(const {blob,name}of files){const url=URL.createObjectURL(blob);resultUrls.push(url);const a=document.createElement('a');a.href=url;a.download=name;a.textContent=name+' 다운로드';a.onclick=()=>status(name+' 다운로드를 요청했습니다.');results.append(a);}}
function jsonBlob(value){return new Blob([JSON.stringify(value,null,2)],{type:'application/json'});}
function filename(){return (layer().name||'texture').replace(/[^a-zA-Z0-9가-힣_-]+/g,'-').slice(0,40)||'texture';}
$('save-preset').onclick=()=>{stop();showResults([{blob:jsonBlob(project()),name:'ember-'+filename()+'.json'}]);$('export-options').hidden=true;$('export-progress').hidden=true;$('start-export').hidden=true;$('cancel-export').hidden=true;$('export-dialog').showModal();status('프리셋을 준비했습니다. 다운로드 링크를 눌러 보관하세요.');};$('load-preset').onclick=()=>$('preset-file').click();$('preset-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>256000)throw Error('프리셋은 256KB 이하 JSON 파일이어야 합니다.');const next=M.parse(JSON.parse(await file.text()));stop(false);change(()=>state=next);thumbnails();draw();status('프리셋을 불러왔습니다.');}catch(err){status('불러오기 실패: '+err.message);}e.target.value='';};
// Export settings and bounded, cancellable offline image generation.
const channelSources=[['r','컬러 R'],['g','컬러 G'],['b','컬러 B'],['a','알파 / 농도'],['nx','Normal X'],['ny','Normal Y'],['nz','Normal Z'],['zero','0 (검정)'],['one','1 (흰색)']];
['R','G','B','A'].forEach((c,i)=>{const label=document.createElement('label');label.className='dialog-field';label.textContent=c;const select=document.createElement('select');select.id='pack-'+c;select.setAttribute('aria-label',c+' 채널 소스');channelSources.forEach(([key,name])=>{const o=document.createElement('option');o.value=key;o.textContent=name;select.append(o);});select.value=['r','g','b','a'][i];label.append(select);$('pack-options').append(label);});
function exportSettings(){const size=Number($('export-size').value),format=$('export-format').value,frames=format==='gif'?Math.max(1,Math.round(duration()*state.fps)):format==='sheet'?Number($('sheet-frames').value):1,columns=format==='sheet'?Math.min(frames,Number($('sheet-columns').value)):1,rows=Math.ceil(frames/columns);return{format,size,frames,columns,rows,channel:$('export-channel').value,transparent:$('export-transparent').checked};}
function exportUI(){const e=exportSettings();$('sheet-options').hidden=e.format!=='sheet';$('gif-options').hidden=e.format!=='gif';$('normal-options').hidden=!['normal','pack'].includes(e.format);$('pack-options').hidden=e.format!=='pack';$('export-channel-row').hidden=['normal','pack'].includes(e.format);$('transparent-row').hidden=['normal','pack'].includes(e.format)||e.channel!=='rgba';let error='';if(e.size>renderer.maxSize)error='이 기기의 최대 출력 크기를 초과했습니다.';if(e.format==='sheet'&&(e.columns*e.size>4096||e.rows*e.size>4096))error='시트는 가로·세로 최대 4096px입니다. 크기나 프레임 수를 줄여주세요.';if(e.format==='gif'&&(e.size>512||e.frames>128))error='GIF는 최대 512px · 128프레임입니다. 크기나 재생 길이를 줄여주세요.';const summary=error||(e.format==='sheet'?`${e.size*e.columns} × ${e.size*e.rows}px · ${e.columns}열 × ${e.rows}행 · ${e.frames}프레임 · ${(e.frames/duration()).toFixed(2)} FPS`:(e.format==='gif'?`${e.size} × ${e.size}px · ${e.frames}프레임 · ${duration().toFixed(2)}초`:`${e.size} × ${e.size}px · ${e.format==='normal'?'RGB 노멀맵':e.format==='pack'?'RGBA 채널 패킹':e.channel==='alpha'?'흑백 농도 마스크':e.transparent?'투명 RGBA':'검정 배경 RGB'}`));$('export-summary').textContent=summary;$('export-summary').classList.toggle('error',!!error);$('start-export').disabled=!!error;return !error;}
$('open-export').onclick=()=>{stop();clearResults();$('export-size').value=state.resolution;$('export-channel').value=viewChannel;$('export-progress').hidden=true;$('export-options').hidden=false;$('start-export').hidden=false;exportUI();$('export-dialog').showModal();};document.querySelectorAll('#export-options select,#export-options input').forEach(el=>el.addEventListener('change',exportUI));
$('cancel-export').onclick=()=>{abortExport=true;$('progress-label').textContent='생성을 취소하고 있습니다…';};$('export-dialog').addEventListener('cancel',e=>{if(busy){e.preventDefault();abortExport=true;}});
const pause=()=>new Promise(resolve=>setTimeout(resolve,0));
async function png(canvas){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG 변환에 실패했습니다.');return blob;}
function put(canvas,image){canvas.width=image.width;canvas.height=image.height;canvas.getContext('2d').putImageData(new ImageData(image.data,image.width,image.height),0,0);}
$('start-export').onclick=async()=>{
 if(busy||!exportUI())return;clearResults();const e=exportSettings(),scene=clone(state),savedView=viewChannel,name='ember-'+filename();busy=true;abortExport=false;$('export-options').hidden=true;$('export-progress').hidden=false;$('cancel-export').hidden=false;$('start-export').disabled=true;$('close-export').disabled=true;const cell=document.createElement('canvas'),out=document.createElement('canvas');let gif,metadata;
 try{
  if(e.format==='sheet'){out.width=e.columns*e.size;out.height=e.rows*e.size;metadata={format:'ember-spritesheet',version:1,width:out.width,height:out.height,cellWidth:e.size,cellHeight:e.size,columns:e.columns,rows:e.rows,frameCount:e.frames,duration:duration(),fps:e.frames/duration(),loop:scene.loop,tileable:scene.tiling,tileBlend:scene.tileBlend,channel:e.channel,frames:[]};}
  if(e.format==='gif')gif=new EmberGifEncoder(e.size,e.size,e.transparent&&e.channel==='rgba',scene.loop);
  for(let i=0;i<e.frames;i++){
   if(abortExport)throw Error('EXPORT_CANCELLED');$('progress-label').textContent=`생성 중 ${i+1} / ${e.frames}`;$('progress').value=i/e.frames;await pause();
   const t=e.frames>1?i/e.frames:scene.time;const raw=['normal','pack'].includes(e.format);renderer.render(cell,scene,{size:e.size,time:t,channel:raw?'rgba':e.channel,bypass,opaque:!raw&&e.format!=='gif'&&(!e.transparent||e.channel==='rgb')});
   if(e.format==='sheet'){out.getContext('2d').drawImage(cell,(i%e.columns)*e.size,Math.floor(i/e.columns)*e.size);metadata.frames.push({index:i,x:(i%e.columns)*e.size,y:Math.floor(i/e.columns)*e.size,time:i/e.frames*duration()});}
   else if(e.format==='gif'){const bytes=cell.getContext('2d').getImageData(0,0,e.size,e.size).data;const delay=Math.max(1,Math.round((i+1)*duration()*100/e.frames)-Math.round(i*duration()*100/e.frames));gif.addFrame(bytes,delay);}
   else if(raw){const image=cell.getContext('2d').getImageData(0,0,e.size,e.size),strength=Number($('normal-strength').value);if(!Number.isFinite(strength)||strength<.1||strength>20)throw Error('노멀 강도는 0.1~20 사이여야 합니다.');const normal=M.normalMap(image,strength,$('normal-flip').checked,scene.tiling);put(out,e.format==='normal'?normal:M.pack(image,normal,['R','G','B','A'].map(c=>$('pack-'+c).value)));}
  }
  if(abortExport)throw Error('EXPORT_CANCELLED');$('progress-label').textContent='파일 변환 중…';await pause();let blob,outputName;
  if(e.format==='gif'){blob=gif.finish();outputName=`${name}-${e.frames}frames.gif`;}
  else{blob=await png(['sheet','normal','pack'].includes(e.format)?out:cell);outputName=e.format==='sheet'?`${name}-${e.columns}x${e.rows}-${e.frames}frames.png`:`${name}-${e.format==='png'?e.channel:e.format}-${e.size}.png`;}
  if(abortExport)throw Error('EXPORT_CANCELLED');const files=[{blob,name:outputName}];if(metadata&&$('sheet-json').checked)files.push({blob:jsonBlob(metadata),name:outputName.replace(/\.png$/,'.json')});showResults(files);$('progress').value=1;$('progress-label').textContent='생성 완료 · 아래 링크로 저장하세요';status(outputName+' 생성 완료');
 }catch(err){if(err.message==='EXPORT_CANCELLED'){status('파일 생성을 취소했습니다.');$('progress-label').textContent='생성을 취소했습니다.';}else{status('내보내기 실패: '+err.message);$('progress-label').textContent=err.message;}}
 finally{busy=false;cell.width=cell.height=1;out.width=out.height=1;gif=null;$('start-export').disabled=false;$('close-export').disabled=false;$('cancel-export').hidden=true;$('export-options').hidden=false;viewChannel=savedView;draw();}
};
try{renderer=new EmberRenderer();new EmberLayout($('studio'));viewer=new EmberViewport($('stage'),$('preview'),v=>{$('zoom-label').textContent=(v.zoom*100).toFixed(0)+'%';$('view-position').textContent='X '+Math.round(v.x)+' · Y '+Math.round(v.y);});try{viewer.boundary=localStorage.getItem('ember-view-boundary')!=='false';}catch{}$('show-boundary').checked=viewer.boundary;$('resolution-label').hidden=!viewer.boundary;sync();filter();thumbnails();draw();renderer.canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();stop(false);status('그래픽 연결이 중단됐습니다. 프리셋 저장 후 새로고침해주세요.');});}catch(e){status(e.message);document.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);$('stage').textContent=e.message;}
window.addEventListener('pagehide',()=>{try{localStorage.setItem(storageKey,JSON.stringify(project()));}catch{}stop(false);});
})();
