<!doctype html><html lang="ko"><meta charset="utf-8"><title>Ember 렌더러 검증</title><style>body{background:#17191f;color:#ddd;font:14px/1.6 sans-serif;padding:20px}table{border-collapse:collapse}td,th{border:1px solid #444;padding:5px 12px}.pass{color:#8ee4a8}.fail{color:#ff9b92}canvas{width:160px;height:160px;background:#08090a;margin:12px}</style><h1>Ember GPU 출력 검증</h1><p id="summary">검사 중…</p><table><thead><tr><th>검사</th><th>결과</th><th>출력 차이 / 경계 오차</th></tr></thead><tbody id="results"></tbody></table><div id="pictures"></div><script src="../catalog.js"></script><script src="../model.js"></script><script src="../post-shader.js"></script><script src="../renderer.js"></script><script>
(async()=>{
 const M=EmberModel,renderer=new EmberRenderer(),canvas=document.createElement('canvas');let failures=0,total=0;const results=[];
 const s=M.defaults();s.layers=[{...M.layer(0),offsetX:.13,offsetY:-.08,radius:.57},{...M.layer(1),opacity:.32,seed:87},{...M.layer(3),opacity:.4,offsetY:.2,rotation:19}];for(const effect of Object.values(s.effects))effect.enabled=false;
 const render=(scene,size=128,options={})=>{renderer.render(canvas,scene,{size,...options});return canvas.getContext('2d').getImageData(0,0,size,size);};
 function difference(a,b){let changed=0,sum=0;for(let i=0;i<a.data.length;i+=4){let max=0;for(let c=0;c<4;c++){const diff=Math.abs(a.data[i+c]-b.data[i+c]);sum+=diff;max=Math.max(max,diff);}if(max>2)changed++;}return{changed,mean:sum/a.data.length};}
 function edges(image){const{width:w,height:h,data:d}=image;let max=0,sum=0,n=0;for(let y=0;y<h;y++)for(let c=0;c<4;c++){let v=Math.abs(d[(y*w)*4+c]-d[(y*w+w-1)*4+c]);max=Math.max(max,v);sum+=v;n++;}for(let x=0;x<w;x++)for(let c=0;c<4;c++){let v=Math.abs(d[x*4+c]-d[((h-1)*w+x)*4+c]);max=Math.max(max,v);sum+=v;n++;}return{max,mean:sum/n};}
 function row(name,pass,detail){total++;if(!pass)failures++;const tr=document.createElement('tr');for(const text of [name,pass?'PASS':'FAIL',detail]){const td=document.createElement('td');td.textContent=text;tr.append(td);}tr.className=pass?'pass':'fail';document.getElementById('results').append(tr);results.push({name,pass,detail});}
 const base=render(s);
 for(const [key,label,min,max,,def]of M.effects){const scene=M.clone(s);scene.effects[key]={enabled:true,value:key==='blur'?3:key==='sharp'?1:key==='toon'?3:key==='pixel'?9:key==='swirl'?1.1:key==='rgb'?4:key==='kaleido'?5:def||max};const diff=difference(base,render(scene));row(label,diff.changed>20,diff.changed+' pixels · MAD '+diff.mean.toFixed(3));await new Promise(r=>setTimeout(r,0));}
 const mono=M.clone(s);mono.gradient=false;const monoBase=render(mono);mono.effects.rgb={enabled:true,value:5};const monoDiff=difference(monoBase,render(mono));row('흑백 모드 색수차',monoDiff.changed>100,monoDiff.changed+' pixels');
 for(const size of [64,128,256]){const scan=M.clone(s),a=render(scan,size);scan.effects.scan={enabled:true,value:.7};const diff=difference(a,render(scan,size));const fraction=diff.changed/(size*size);row('스캔라인 '+size+'px',fraction>.2&&fraction<.45,(fraction*100).toFixed(2)+'% of pixels');}
 const tiled=M.clone(s);tiled.layers=[{...M.layer(1),opacity:1,offsetX:.11,seed:189}];tiled.tiling=true;tiled.tileBlend=.2;
 for(const key of ['none',...M.effects.map(e=>e[0])]){const scene=M.clone(tiled);if(key!=='none')scene.effects[key]={enabled:true,value:M.effects.find(e=>e[0]===key)[5]||1};const edge=edges(render(scene));row('심리스 경계 · '+key,edge.max<=3,'max '+edge.max+' · mean '+edge.mean.toFixed(4));await new Promise(r=>setTimeout(r,0));}
 const combo=M.clone(tiled);combo.effects.swirl={enabled:true,value:1.1};combo.effects.rgb={enabled:true,value:4};combo.effects.bloom={enabled:true,value:1};const edge=edges(render(combo));row('복합 후처리 + 타일링',edge.max<=3,'max '+edge.max);
 const before=render(s),all=M.clone(s);for(const fx of Object.values(all.effects))fx.enabled=true;const bypass=difference(before,render(all,128,{bypass:true}));row('전체 후처리 우회',bypass.mean<.5,'MAD '+bypass.mean.toFixed(4));
 function rawSample(image,u,v){const n=image.width,x=Math.max(0,Math.min(n-1,u*n-.5)),y=Math.max(0,Math.min(n-1,(1-v)*n-.5)),x0=Math.floor(x),y0=Math.floor(y),x1=Math.min(n-1,x0+1),y1=Math.min(n-1,y0+1),a=x-x0,b=y-y0,d=image.data;return (d[(y0*n+x0)*4+3]*(1-a)+d[(y0*n+x1)*4+3]*a)*(1-b)+(d[(y1*n+x0)*4+3]*(1-a)+d[(y1*n+x1)*4+3]*a)*b;}
 for(const type of [0,1,4,6]){const scene=M.clone(s);scene.gradient=false;scene.layers=[{...M.layer(type),offsetX:.11,rotation:17,distort:.4}];const raw=render(scene,128,{bypass:true});scene.layers[0].polar=true;const warped=render(scene,128,{bypass:true});let maxError=0,sumError=0,count=0;for(let y=0;y<128;y+=2)for(let x=0;x<128;x+=2){const qx=(x+.5)/128*2-1,qy=1-(y+.5)/128*2,r=Math.hypot(qx,qy);if(r>.95)continue;let u=Math.atan2(qy,qx)/(2*Math.PI)+.5;u=((u%1)+1)%1;const error=Math.abs(rawSample(raw,u,r)-warped.data[(y*128+x)*4+3]);maxError=Math.max(maxError,error);sumError+=error;count++;}row('실제 이미지 극좌표 · '+M.materials[type][0],maxError<3,'max '+maxError.toFixed(2)+' · mean '+(sumError/count).toFixed(3));}
 function moments(image){let mass=0,x=0,y=0;const n=image.width;for(let j=0;j<n;j++)for(let i=0;i<n;i++){const a=image.data[(j*n+i)*4+3];mass+=a;x+=(i-(n-1)/2)**2*a;y+=(j-(n-1)/2)**2*a;}return{x:x/mass,y:y/mass};}
 const directional=M.clone(s);directional.gradient=false;directional.layers=[M.layer(2)];directional.effects.directional={enabled:true,value:32};directional.directionalAngle=0;const h=moments(render(directional));directional.directionalAngle=90;const v=moments(render(directional));row('디렉셔널 0도 · 수평 확산',h.x>h.y+10,'variance '+h.x.toFixed(2)+' / '+h.y.toFixed(2));row('디렉셔널 90도 · 수직 확산',v.y>v.x+10,'variance '+v.x.toFixed(2)+' / '+v.y.toFixed(2));

 for(const index of M.materialOrder){const scene=M.defaults();scene.gradient=false;scene.layers=[M.layer(index)];for(const e of Object.values(scene.effects))e.enabled=false;const image=render(scene,64);let lo=255,hi=0,mass=0;for(let i=3;i<image.data.length;i+=4){const v=image.data[i];lo=Math.min(lo,v);hi=Math.max(hi,v);mass+=v;}row('소재 출력 · '+M.materials[index][0],hi-lo>5&&mass>0,'range '+lo+'–'+hi);await new Promise(r=>setTimeout(r,0));}
 for(const scene of [s,combo]){const out=document.createElement('canvas');renderer.render(out,scene,{size:256});document.getElementById('pictures').append(out);}
 document.getElementById('summary').textContent=(failures?'FAIL':'PASS')+' · '+(total-failures)+' / '+total+' 검사 통과';document.getElementById('summary').className=failures?'fail':'pass';
 const blob=new Blob([JSON.stringify({total,failures,results},null,2)],{type:'application/json'}),a=document.createElement('a');a.textContent='검증 결과 JSON 다운로드';a.href=URL.createObjectURL(blob);a.download='ember-renderer-audit.json';document.body.append(a);
})().catch(e=>{document.getElementById('summary').textContent='FAIL: '+e.message;});
</script></html>
