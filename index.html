<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="브라우저에서 이펙트 텍스처를 합성하고 애니메이션, 후처리, PNG·GIF·시트로 내보내는 도구"><title>Ember · Texture Studio</title><link rel="stylesheet" href="style.css"></head><body>
<div id="tc-layout-proposals"><div id="studio" class="tc-app tc-classic">
<header class="tc-header"><strong class="tc-brand">Texture Studio</strong><span class="tc-badge">EMBER · 브라우저에서 실행</span><div class="ui-controls"><label for="ui-scale">UI 크기</label><input id="ui-scale" type="range" min="80" max="140" step="5" value="100" aria-label="UI 크기"><output id="ui-scale-value" for="ui-scale">100%</output><button id="reset-ui">UI 초기화</button></div><div class="tc-header-actions"><button id="undo" title="실행 취소 (Ctrl+Z)" disabled>↶</button><button id="redo" title="다시 실행 (Ctrl+Shift+Z)" disabled>↷</button><button id="save-preset">프리셋 저장</button><button id="load-preset">불러오기</button></div></header>
<div class="tc-body"><aside class="tc-rail" aria-label="레이어"><button id="add-layer" class="tc-add" aria-label="레이어 추가">＋</button><div id="layers" class="tc-layers"></div></aside>
<aside class="tc-source" aria-label="선택 레이어 설정"><section class="tc-panel"><div class="tc-panel-title">레이어 설정 <span>▾</span></div><div class="tc-panel-inner"><label class="tc-field">레이어 이름<input id="layer-name" maxlength="32" type="text"></label><label class="tc-field">합성 모드<select id="blend"><option value="normal">일반 (Normal)</option><option value="add">더하기 (Add)</option><option value="multiply">곱하기 (Multiply)</option><option value="screen">스크린 (Screen)</option><option value="mask">마스크 (Mask)</option></select></label><div id="opacity-control"></div><div class="layer-actions"><button id="move-up" aria-label="레이어 위로">↑</button><button id="move-down" aria-label="레이어 아래로">↓</button><button id="duplicate">복제</button><button id="remove-layer">삭제</button></div></div></section>
<section class="tc-panel"><div class="tc-panel-title">텍스처 · 기본 <span>▾</span></div><div class="tc-panel-inner"><label class="tc-field">타입 (Type)<select id="material"></select></label><label class="tc-check"><span>극좌표 변환</span><input id="polar" type="checkbox" title="현재 레이어 이미지 전체를 원형으로 감쌉니다"></label><label class="tc-check"><span>흑백 반전</span><input id="invert" type="checkbox"></label><details><summary>Transform</summary><div id="transform-controls"></div></details></div></section>
<section class="tc-panel"><div class="tc-panel-title">소재 파라미터 <span>▾</span></div><div class="tc-panel-inner"><div id="source-controls"></div><div class="seed-row"><label for="seed">시드</label><input id="seed" type="number" min="0" max="99999" step="1"><button id="random-seed" aria-label="랜덤 시드">⤨</button></div><button id="reset-layer" class="full-button">소재 값 초기화</button></div></section></aside>
<div id="left-splitter" class="panel-resizer" role="separator" aria-label="소재 설정 패널 너비" aria-orientation="vertical" aria-valuenow="174" tabindex="0"></div><main class="tc-center"><div class="tc-toolbar"><button id="open-export" class="tc-export">Save Export ▾</button><select id="samples" aria-label="샘플 프리셋"><option value="">샘플 선택</option><option value="energy">에너지 링</option><option value="fire">불꽃</option><option value="electric">번개</option><option value="slash">베기</option><option value="smoke">연기</option></select><label><input id="black-bg" type="checkbox">검정</label><label><input id="checker-bg" type="checkbox" checked>체커</label></div>
<div class="view-tools"><button id="repeat-view" aria-pressed="false">▦ 타일 반복 보기</button><label class="boundary-control"><input id="show-boundary" type="checkbox" checked>경계 표시</label><button id="fit-view">화면 맞춤</button><button id="actual-view">100%</button><span id="zoom-label">100%</span><span id="view-position">X 0 · Y 0</span></div><div id="stage" class="tc-stage-wrap"><canvas id="preview" class="tc-preview" width="512" height="512" role="img" aria-label="최종 텍스처 실시간 미리보기"></canvas><span id="resolution-label" class="tc-resolution-label">512 × 512 px</span></div>
<div class="tc-channel-row" role="group" aria-label="출력 채널"><button data-channel="rgba" aria-pressed="true">RGBA</button><button data-channel="alpha" aria-pressed="false">알파</button><button data-channel="rgb" aria-pressed="false">RGB</button><button id="bypass" aria-pressed="false">후처리 끄기</button><span id="selected-label"></span></div>
<div class="tc-transport"><button id="play" aria-label="애니메이션 재생">▶</button><button id="rewind" aria-label="시작으로 이동">↤</button><input id="timeline" type="range" min="0" max="1" step=".001" value="0" aria-label="시간 탐색"><span id="time-read" class="tc-time-read">0.00 / 2.00 s</span></div>
<details id="library" class="tc-type-browser"><summary class="tc-browser-head"><span>▸ 소재 라이브러리</span><span id="library-count"></span></summary><div class="library-filter"><input id="search" type="search" placeholder="소재 검색" aria-label="소재 검색"><select id="category" aria-label="소재 분류"><option value="all">전체</option></select></div><div class="library-modes"><button data-library-mode="all" aria-pressed="true">전체</button><button data-library-mode="favorites" aria-pressed="false">즐겨찾기</button><button data-library-mode="recent" aria-pressed="false">최근 사용</button><span id="library-results">119 / 119종</span></div><div id="materials" class="tc-type-grid"></div></details></main>
<div id="right-splitter" class="panel-resizer" role="separator" aria-label="후처리 패널 너비" aria-orientation="vertical" aria-valuenow="226" tabindex="0"></div><aside class="tc-right" aria-label="전역 설정과 후처리"><section class="tc-panel"><div class="tc-panel-title">전역 설정</div><div class="tc-panel-inner"><label class="tc-check"><span>심리스 타일링 생성</span><input id="tileable" type="checkbox"></label><div id="tile-blend-control"></div><label class="tc-field">해상도<select id="resolution"><option value="64">64 × 64</option><option value="128">128 × 128</option><option value="256">256 × 256</option><option value="512" selected>512 × 512</option><option value="1024">1024 × 1024</option><option value="2048">2048 × 2048</option></select></label></div></section>
<section class="tc-panel"><div class="tc-panel-title">애니메이션 <span>ANIMATION</span></div><div class="tc-panel-inner"><label class="tc-check"><span>심리스 루프</span><input id="loop" type="checkbox" checked></label><div id="speed-control"></div><div class="tc-split-fields"><label class="tc-field">FPS<select id="fps"><option>8</option><option selected>16</option><option>24</option><option>30</option></select></label><label class="tc-field">길이 (초)<input id="duration" type="number" min=".5" max="8" step=".5" value="2"></label></div><p id="effective-duration" class="hint"></p></div></section>
<section class="tc-panel"><div class="tc-panel-title">포스트 이펙트 <span>POST FX</span></div><div id="effects" class="tc-panel-inner"></div></section>
<section class="tc-panel"><div class="tc-panel-title">그라데이션 램프<input id="gradient-enabled" type="checkbox" checked aria-label="그라데이션 사용"></div><div class="tc-panel-inner"><div id="ramp" class="tc-ramp" aria-label="그라데이션 미리보기"></div><div id="gradient-stops"></div><div class="gradient-edit"><label>위치 <input id="stop-position" type="number" min="0" max="100" step="1" aria-label="색 정지점 위치">%</label><input id="stop-color" type="color" aria-label="선택한 정지점 색"><button id="add-stop" aria-label="색 정지점 추가">＋</button><button id="delete-stop" aria-label="선택 정지점 삭제">삭제</button></div><div id="palettes" class="tc-palettes"></div></div></section></aside></div>
<footer class="tc-footer"><span id="status" role="status" aria-live="polite">모든 계산은 이 브라우저 안에서 처리됩니다.</span><span id="animation-info">16 FPS · 2초 · 32프레임</span></footer></div></div>
<input id="preset-file" type="file" accept=".json,application/json" hidden>
<dialog id="export-dialog"><form method="dialog" class="dialog-head"><strong>내보내기</strong><button id="close-export" aria-label="내보내기 닫기">✕</button></form><div class="dialog-content"><div id="export-options"><label class="dialog-field">형식<select id="export-format"><option value="png">현재 프레임 PNG</option><option value="sheet">애니메이션 시트 PNG</option><option value="gif">애니메이션 GIF</option><option value="normal">노멀맵 PNG</option><option value="pack">채널 패킹 PNG</option></select></label><label class="dialog-field">크기<select id="export-size"><option>64</option><option>128</option><option>256</option><option selected>512</option><option>1024</option><option>2048</option></select></label><label id="export-channel-row" class="dialog-field">채널<select id="export-channel"><option value="rgba">RGBA · 컬러</option><option value="alpha">A · 흑백 마스크</option><option value="rgb">RGB · 검정 배경</option></select></label><label id="transparent-row" class="tc-check"><span>투명 배경</span><input id="export-transparent" type="checkbox" checked></label><div id="sheet-options" hidden><label class="dialog-field">프레임 수<select id="sheet-frames"><option>4</option><option>8</option><option selected>16</option><option>32</option><option>64</option></select></label><label class="dialog-field">열 수<select id="sheet-columns"><option>2</option><option selected>4</option><option>8</option></select></label><label class="tc-check"><span>재생 정보 JSON 함께 저장</span><input id="sheet-json" type="checkbox" checked></label></div><div id="gif-options" hidden><p class="hint">GIF는 최대 512px · 128프레임입니다. 색상은 256색이며 투명도는 켜짐/꺼짐으로 저장됩니다.</p></div><div id="normal-options" hidden><label class="dialog-field">노멀 강도<input id="normal-strength" type="number" min=".1" max="20" step=".1" value="3"></label><label class="tc-check"><span>Y 채널 반전</span><input id="normal-flip" type="checkbox"></label></div><div id="pack-options" hidden></div><p id="export-summary" class="export-summary"></p></div><div id="export-progress" hidden><label id="progress-label" for="progress">준비 중</label><progress id="progress" max="1" value="0"></progress></div><div class="dialog-buttons"><button id="cancel-export" type="button" hidden>생성 취소</button><button id="start-export" class="accent-button" type="button">파일 만들기</button></div></div></dialog>
<script src="catalog.js"></script><script src="model.js"></script><script src="post-shader.js"></script><script src="renderer.js"></script><script src="gif.js"></script><script src="layout.js"></script><script src="view.js"></script><script src="app.js"></script>
</body></html>
